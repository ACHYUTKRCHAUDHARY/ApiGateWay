spring.application.name=smart-gateway-service
server.port=${PORT:8080}
info.app.name=Smart Gateway Service
info.app.description=Custom Api gateway for routing, security, rate limiting, and traffic management

gatekeeper.management-service-url=${GATEKEEPER_MANAGEMENT_SERVICE_URL:http://localhost:8081}
gatekeeper.analytics-service-url=${GATEKEEPER_ANALYTICS_SERVICE_URL:http://localhost:8082}
gatekeeper.sync-interval-seconds=10
gatekeeper.kafka-topic=gateway-access-logs
gatekeeper.redis.enabled=true
gatekeeper.kafka.enabled=false

spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.timeout=500ms

spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.properties.max.block.ms=500
spring.kafka.producer.retries=0
