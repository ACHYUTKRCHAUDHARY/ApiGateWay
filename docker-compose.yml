version: '3.8'

services:
  # ----------------------------------------------------
  # INFRASTRUCTURE SERVICES
  # ----------------------------------------------------
  mysql:
    image: mysql:8.0
    container_name: gatekeeper-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: gatekeeper_management
      MYSQL_USER: gatekeeper_user
      MYSQL_PASSWORD: gatekeeper_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - gatekeeper-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: gatekeeper-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - gatekeeper-net

  mongodb:
    image: mongo:7.0
    container_name: gatekeeper-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - gatekeeper-net

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: gatekeeper-zookeeper
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - gatekeeper-net

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: gatekeeper-kafka
    restart: unless-stopped
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - gatekeeper-net

  # ----------------------------------------------------
  # GATEKEEPER MICROSERVICES
  # ----------------------------------------------------
  api-management-service:
    build:
      context: ./api-management-service
      dockerfile: Dockerfile
    container_name: gatekeeper-api-management
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/gatekeeper_management?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: rootpassword
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - gatekeeper-net

  smart-gateway-service:
    build:
      context: ./smart-gateway-service
      dockerfile: Dockerfile
    container_name: gatekeeper-smart-gateway
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      GATEKEEPER_MANAGEMENT_SERVICE_URL: http://api-management-service:8081
      GATEKEEPER_ANALYTICS_SERVICE_URL: http://analytics-service:8082
      SPRING_DATA_REDIS_HOST: redis
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      GATEKEEPER_REDIS_ENABLED: "true"
      GATEKEEPER_KAFKA_ENABLED: "true"
    depends_on:
      - api-management-service
      - redis
      - kafka
    networks:
      - gatekeeper-net

  analytics-service:
    build:
      context: ./analytics-service
      dockerfile: Dockerfile
    container_name: gatekeeper-analytics
    restart: unless-stopped
    ports:
      - "8082:8082"
    environment:
      SPRING_DATA_MONGODB_URI: mongodb://mongodb:27017/gatekeeper_analytics
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      GATEKEEPER_ANALYTICS_KAFKA_ENABLED: "true"
      GATEKEEPER_ANALYTICS_MONGODB_ENABLED: "true"
    depends_on:
      - mongodb
      - kafka
    networks:
      - gatekeeper-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: gatekeeper-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      MANAGEMENT_URL: http://api-management-service:8081
      GATEWAY_URL: http://smart-gateway-service:8080
      ANALYTICS_URL: http://analytics-service:8082
    depends_on:
      - smart-gateway-service
      - api-management-service
      - analytics-service
    networks:
      - gatekeeper-net

networks:
  gatekeeper-net:
    driver: bridge

volumes:
  mysql_data:
  redis_data:
  mongo_data:

