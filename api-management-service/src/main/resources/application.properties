spring.application.name=api-management-service
server.port=${PORT:8081}
info.app.name=api-management-service
info.app.description=Custom Api gateway for routing,security and traffic management

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:gatekeeper_management;DB_CLOSE_DELAY=-1;MODE=MySQL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.flyway.enabled=${SPRING_FLYWAY_ENABLED:false}
