spring.application.name=analytics-service
server.port=8082
info.app.name=Analytics Service
info.app.description=Custom Api gateway for routing, security and traffic management

spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI:mongodb://localhost:27017/gatekeeper_analytics}
spring.data.mongodb.auto-index-creation=true

spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=gatekeeper-analytics-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

gatekeeper.analytics.kafka-enabled=false
gatekeeper.analytics.mongodb-enabled=false
